version: '3.8'

services:
  # 1. Redis Server
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  # 2. Flask Backend
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    env_file: ./backend/.env
    depends_on:
      - redis

  # 3. Celery Worker
  worker:
    build: ./backend
    command: celery -A task worker --loglevel=info -P eventlet
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - backend

  # 4. Celery Beat
  beat:
    build: ./backend
    command: celery -A task beat --loglevel=info
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - backend

# 5. Vue Frontend
  frontend:
    build: ./frontend        # Points to the frontend folder
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app      # Mounts the local frontend folder to /app in container
      - /app/node_modules    # Prevents local node_modules from overwriting container's
    depends_on:
      - backend